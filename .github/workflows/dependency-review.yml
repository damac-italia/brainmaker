name: dependency-review

on:
  pull_request:
    branches: [master]

# Cargo.lock is committed, so GitHub populates the dependency graph natively —
# no submission step needed. This workflow only blocks PRs that introduce a
# dependency with a known CVE, comparing against the base branch.
#
# Synapsis guards the same step behind a repository capability check, because
# a private repository needs GitHub Advanced Security for it. This repository
# is public, where the dependency review API is available to everyone, so the
# guard would only ever skip the review here. It is left out on purpose. Add
# the guard if this repository ever becomes private.
jobs:
  review:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
