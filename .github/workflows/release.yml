name: release

# Builds brainmaker for every supported platform and writes the software
# manifest. Each target is built on its own native runner, so nothing is
# cross-compiled.
#
# Push a tag such as v0.2.0 to build and to create a GitHub release, or start
# the workflow by hand to build without releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Every job reads the repository and nothing more. The manifest job alone
# creates the release, so it alone may write.
permissions:
  contents: read

# This workflow learns no customer endpoint, and it publishes none. The manifest
# carries a version and one SHA-256 per platform. Each client derives the
# download address from the base URL in its own provisioning file.

jobs:
  build:
    name: build ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - key: darwin-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - key: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          # GitHub's arm64 Linux runners are free for public repositories and
          # need a paid plan for private ones. If this job cannot start, see
          # "Building linux-arm64 without an arm64 runner" in README.md.
          - key: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - key: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            exe: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes to the repository, so the token does not stay
          # in the checkout.
          persist-credentials: false

      # A build without the key would ship the published development key, and
      # every employee's sealed configuration would be readable with a stock
      # build. Fail here rather than release such a binary.
      - name: Check that the configuration key is set
        shell: bash
        env:
          BRAINMAKER_CONFIG_KEY: ${{ secrets.BRAINMAKER_CONFIG_KEY }}
        run: |
          if [ -z "${BRAINMAKER_CONFIG_KEY:-}" ]; then
            echo "the repository secret BRAINMAKER_CONFIG_KEY is not set" >&2
            echo "set it before you release, or every build ships the development key" >&2
            exit 1
          fi
          echo "the configuration key is set"

      # A binary with no signing key in src/signature.rs refuses every software
      # manifest, so it can never self-update. Catch that here rather than at a
      # user's self-update.
      - name: Check that a manifest signing key is compiled in
        shell: bash
        run: |
          if ! grep -Eq '^[[:space:]]*"[0-9a-fA-F]{64}",' src/signature.rs; then
            echo "PUBLIC_KEYS in src/signature.rs holds no public key" >&2
            echo "run: cargo run --features sign --bin brainmaker-sign -- keygen signing.key" >&2
            echo "then paste the printed key into src/signature.rs and commit it" >&2
            exit 1
          fi
          echo "a manifest signing key is compiled in"

      # A binary with no content key installs no content, the same way a binary
      # with no software key installs no update. The block is read on its own,
      # because the PUBLIC_KEYS check above would pass on either list's keys.
      - name: Check that a content signing key is compiled in
        shell: bash
        run: |
          block=$(sed -n '/^pub const CONTENT_KEYS/,/^];/p' src/signature.rs)
          if ! grep -Eq '^[[:space:]]*"[0-9a-fA-F]{64}",' <<<"$block"; then
            echo "CONTENT_KEYS in src/signature.rs holds no public key" >&2
            echo "run: brainmaker-sign keygen content-signing.key" >&2
            echo "then paste the printed key into CONTENT_KEYS and commit it" >&2
            exit 1
          fi
          echo "a content signing key is compiled in"

      # musl gives a fully static Linux binary, so it runs on any distribution
      # of that architecture and has no glibc version floor.
      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The same toolchain step that the test workflow uses, so that a release
      # is built by the compiler that tested it, and not by whatever the
      # runner image holds.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build the dependencies
        # ring compiles C, so cc-rs must find a compiler that targets musl.
        # For x86_64-unknown-linux-musl, cc-rs tries "x86_64-linux-musl-gcc"
        # and then falls back to "musl-gcc". For aarch64-unknown-linux-musl it
        # tries "aarch64-linux-musl-gcc" with no musl fallback, and then drops
        # to plain "gcc", which targets glibc. Name the compiler here so that
        # neither target relies on that guess.
        #
        # This step holds no secret. Every dependency, with its build script
        # and its procedural macros, compiles here.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build
        # build.rs declares rerun-if-env-changed for the key, so this run
        # rebuilds the brainmaker crate alone. No dependency compiles again,
        # and no dependency build script runs again. The procedural macros that
        # the brainmaker crate uses, such as serde_derive, still run in this
        # step with the key in their environment, so the split keeps the key
        # from dependency build scripts, not from all dependency code.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          # Seals each employee's stored configuration. It lives only in this
          # secret, never in the repository. Rotating it makes every existing
          # stored configuration unreadable, so every employee must reimport
          # their brainmaker.env file.
          BRAINMAKER_CONFIG_KEY: ${{ secrets.BRAINMAKER_CONFIG_KEY }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # An unsigned binary that arrives over the network does not run on Apple
      # Silicon. An ad-hoc signature is enough to let it start.
      - name: Sign the macOS build
        if: startsWith(matrix.key, 'darwin')
        run: codesign -s - -f target/${{ matrix.target }}/release/brainmaker

      - name: Name the binary
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/brainmaker${{ matrix.exe }}" \
             "dist/brainmaker-$version-${{ matrix.key }}${{ matrix.exe }}"

      - name: Check that the binary runs and reports the right version
        # A cross-architecture binary cannot run on its build runner. Every
        # target here is native, so this check always applies.
        shell: bash
        run: |
          reported=$("dist/brainmaker-$VERSION-${{ matrix.key }}${{ matrix.exe }}" --version | tr -d '\r')
          echo "$reported"
          test "$reported" = "brainmaker $VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brainmaker-${{ matrix.key }}
          path: dist/brainmaker-*
          if-no-files-found: error
          retention-days: 7

  manifest:
    name: manifest
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes to the repository, so the token does not stay
          # in the checkout.
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: staging
          pattern: brainmaker-*
          merge-multiple: true

      - name: Read the version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # A tag must name the version in Cargo.toml. A mismatch would publish a
      # manifest whose binaries carry a different version, and every
      # self-update would then fail its version check.
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "tag v$tag does not match version $VERSION in Cargo.toml" >&2
            exit 1
          fi

      # The manifest holds a version and one checksum per platform, and no URL,
      # so printing it here discloses nothing.
      - name: Write the manifest
        run: |
          mkdir -p dist
          cp staging/brainmaker-* dist/
          chmod +x scripts/make-manifest.sh
          ./scripts/make-manifest.sh dist "$VERSION"
          cat dist/manifest.json

      # The same toolchain step that the test workflow uses, so that a release
      # is built by the compiler that tested it, and not by whatever the
      # runner image holds.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      # Built with no secret in the environment. A dependency build script or
      # a procedural macro runs during this step, and it must find no key.
      - name: Build the signing tool
        run: cargo build --release --locked --features sign --bin brainmaker-sign

      # brainmaker refuses an unsigned manifest, so a release without this
      # secret would publish a manifest that every client rejects. A run
      # started by hand builds and checksums, and signs nothing, because no
      # tag vouches for the version it would sign.
      - name: Check that the signing key is set
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BRAINMAKER_SIGNING_KEY: ${{ secrets.BRAINMAKER_SIGNING_KEY }}
        run: |
          if [ -z "${BRAINMAKER_SIGNING_KEY:-}" ]; then
            echo "the repository secret BRAINMAKER_SIGNING_KEY is not set" >&2
            echo "generate a key with the brainmaker-sign tool, store the private half here," >&2
            echo "and put the public half in PUBLIC_KEYS in src/signature.rs" >&2
            exit 1
          fi
          echo "the signing key is set"

      # The private key reaches the tool through the environment and never
      # touches the runner's disk. The tool refuses to sign a manifest that
      # brainmaker could not use. An earlier step, which held no secret, built
      # the tool, so no build script runs here.
      - name: Sign the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BRAINMAKER_SIGNING_KEY: ${{ secrets.BRAINMAKER_SIGNING_KEY }}
        run: ./target/release/brainmaker-sign sign - dist/manifest.json dist/manifest.signed.json

      # The signed manifest must verify against the keys that this revision
      # compiles into the binaries. A key mismatch here would otherwise stop
      # every self-update in the field.
      - name: Check that the signed manifest verifies
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Read the PUBLIC_KEYS block alone. A bare grep over the file would
          # also collect CONTENT_KEYS, and verify passes when ANY key given
          # accepts — so a manifest signed with the content key would pass this
          # check, which is the one thing it exists to catch.
          block=$(sed -n '/^pub const PUBLIC_KEYS/,/^];/p' src/signature.rs)
          keys=$(grep -Eo '"[0-9a-fA-F]{64}"' <<<"$block" | tr -d '"')
          if [ -z "$keys" ]; then
            echo "PUBLIC_KEYS in src/signature.rs holds no public key" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          ./target/release/brainmaker-sign verify dist/manifest.signed.json $keys

      # The deploy host signs a content release, so it needs this tool built for
      # its own platform. It goes in its own directory: make-manifest.sh globs
      # dist/brainmaker-*, and a tool named that way would enter the manifest as
      # if it were a platform binary.
      - name: Name the signing tool for release
        run: |
          mkdir -p tools-dist
          cp target/release/brainmaker-sign \
             "tools-dist/brainmaker-sign-$VERSION-linux-x86_64"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brainmaker-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # GitHub writes the notes from the pull requests merged since the
      # previous tag: a "What's Changed" list, any new contributors, and a
      # full changelog link.
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* tools-dist/* \
            --title "brainmaker $VERSION" \
            --generate-notes
