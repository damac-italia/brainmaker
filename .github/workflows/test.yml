name: test

# Runs the unit tests on every push to master and on every pull request.
#
# The tests need no network and no database: every module tests against a
# temporary directory or an in-memory value. The release workflow builds the
# five platform binaries; this one only proves that the code is correct.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # The product ships for three systems, and each one has code that the
    # others never compile: the LaunchAgent and ioreg on macOS, the registry
    # and the directory links on Windows. arm64 Linux runners are free for
    # public repositories, and this one is public.
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
          - os: macos-14
          # Several tests name Unix paths, so a failure on Windows does not
          # yet prove a defect. The job compiles and lints as a hard gate;
          # its test step reports and does not block. Remove `experimental`
          # once the Windows tests pass.
          - os: windows-2022
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        # Pinned to a SHA, so the channel can no longer come from the ref name
        # (@stable) — select it explicitly via the toolchain input.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          # dtolnay/rust-toolchain installs the minimal profile, which
          # carries neither rustfmt nor clippy. Name them here.
          components: rustfmt, clippy

      - name: Check the formatting
        # Runs before the cache step, because it compiles nothing. The
        # formatting does not depend on the system, so one runner checks it.
        if: matrix.os == 'ubuntu-24.04-arm'
        run: cargo fmt --all --check

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run clippy
        # -D warnings makes a lint an error, so a warning cannot reach
        # master unnoticed. --features sign covers tools/sign.rs too.
        run: cargo clippy --workspace --all-targets --locked --features sign -- -D warnings

      - name: Run tests
        # --features sign also compiles tools/sign.rs, which a plain
        # `cargo test` skips because the brainmaker-sign binary requires that
        # feature. The release workflow depends on that tool, so a break in it
        # must fail here rather than at a release.
        #
        # BRAINMAKER_CONFIG_KEY stays unset on purpose: the tests seal and open
        # their own values with the development key, and the release workflow
        # is the only place that needs the real one.
        #
        # The Windows entry of the matrix is marked experimental, so a failing
        # test there is reported and does not block a merge.
        continue-on-error: ${{ matrix.experimental == true }}
        run: cargo test --workspace --all-targets --locked --features sign
